x-backend-env: &backend-env
  # ─── Core ───────────────────────────────────────────────────────────────────
  TZ: Asia/Shanghai
  FLASK_ENV: production
  SECRET_KEY: ${SECRET_KEY}
  FRONTEND_URL: ${FRONTEND_URL:-http://nutrition.school.edu.cn}
  # ─── Database ─────────────────────────────────────────────────────────────────
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: nutrition_db
  POSTGRES_USER: nutrition
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  # ─── Inference clients ────────────────────────────────────────────────────────
  DISH_RECOGNITION_MODE: ${DISH_RECOGNITION_MODE:-local_embedding}
  INFERENCE_API_TOKEN: ${INFERENCE_API_TOKEN:-cv2026}
  INFERENCE_API_TIMEOUT: ${INFERENCE_API_TIMEOUT:-60}
  INFERENCE_CONTROL_TIMEOUT: ${INFERENCE_CONTROL_TIMEOUT:-3}
  RECOGNITION_TASK_SOFT_TIME_LIMIT: ${RECOGNITION_TASK_SOFT_TIME_LIMIT:-150}
  RECOGNITION_TASK_TIME_LIMIT: ${RECOGNITION_TASK_TIME_LIMIT:-180}
  RECOGNITION_DISPATCH_LEASE_SECONDS: ${RECOGNITION_DISPATCH_LEASE_SECONDS:-300}
  RECOGNITION_QUEUED_LEASE_SECONDS: ${RECOGNITION_QUEUED_LEASE_SECONDS:-21600}
  DETECTOR_API_BASE_URL: ${DETECTOR_API_BASE_URL:-http://10.0.4.29:5001}
  RETRIEVAL_API_BASE_URL: ${RETRIEVAL_API_BASE_URL:-http://10.0.4.29:5002}
  YOLO_MAX_REGIONS: ${YOLO_MAX_REGIONS:-6}
  # ─── Optional integrations (only needed when enabled) ─────────────────────────
  ZTK_DB_HOST: ${ZTK_DB_HOST:-}
  ZTK_DB_PORT: ${ZTK_DB_PORT:-1433}
  ZTK_DB_NAME: ${ZTK_DB_NAME:-ZYTK40_PLUS}
  ZTK_DB_USER: ${ZTK_DB_USER:-}
  ZTK_DB_PASSWORD: ${ZTK_DB_PASSWORD:-}
  ZTK_SYNC_ENABLED: ${ZTK_SYNC_ENABLED:-false}
  DINGTALK_APP_KEY: ${DINGTALK_APP_KEY}
  DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET}
  DINGTALK_AGENT_ID: ${DINGTALK_AGENT_ID}
  DINGTALK_CORP_ID: ${DINGTALK_CORP_ID}
  DINGTALK_WEBHOOK_TOKEN: ${DINGTALK_WEBHOOK_TOKEN:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
  OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: nutrition_db
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition -d nutrition_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  flask-api:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: /bin/sh -c "flask bootstrap-db && exec gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 wsgi:app"
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  celery-worker:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: celery -A wsgi:celery worker --loglevel=info --concurrency=2 -Q celery,matching,maintenance
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g  # OpenCV needs more memory

  celery-worker-recognition:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: celery -A wsgi:celery worker --loglevel=info --concurrency=${RECOGNITION_WORKER_CONCURRENCY:-2} -Q recognition
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g

  celery-worker-video:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: celery -A wsgi:celery worker --loglevel=info --concurrency=1 -Q video
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g

  celery-beat:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: celery -A wsgi:celery beat --loglevel=info --schedule /app/celerybeat-data/celerybeat-schedule
    volumes:
      - celery_beat_data:/app/celerybeat-data
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy

  flower:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: unless-stopped
    command: celery -A wsgi:celery flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    environment:
      <<: *backend-env
    expose:
      - "5555"  # internal only

  frontend:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/frontend:${VERSION:-latest}
    restart: always
    environment:
      TZ: Asia/Shanghai
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "5080:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
      - ${DATA_DIR:-./data}/images:/data/images:ro
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache:ro
    depends_on:
      - flask-api
      - frontend
    deploy:
      resources:
        limits:
          memory: 128m

  # MediaMTX - RTSP ingest to WebRTC preview server (disabled)
  # mediamtx:
  #   image: bluenviron/mediamtx:latest-ffmpeg
  #   environment:
  #     TZ: Asia/Shanghai
  #   ports:
  #     - "8554:8554"       # RTSP ingest
  #     - "8889:8889"       # WebRTC / WHEP HTTP
  #     - "8189:8189/tcp"   # WebRTC ICE TCP fallback
  #     - "8189:8189/udp"   # WebRTC ICE UDP
  #   volumes:
  #     - ./mediamtx.yml:/mediamtx.yml:ro
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  celery_beat_data:
  nginx_logs:
