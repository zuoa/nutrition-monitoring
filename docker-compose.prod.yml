x-backend-env: &backend-env
  # ─── Core ───────────────────────────────────────────────────────────────────
  TZ: Asia/Shanghai
  FLASK_ENV: production
  SECRET_KEY: ${SECRET_KEY}
  FRONTEND_URL: ${FRONTEND_URL:-http://nutrition.school.edu.cn}
  # ─── Database ─────────────────────────────────────────────────────────────────
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: nutrition_db
  POSTGRES_USER: nutrition
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  # ─── Inference clients ────────────────────────────────────────────────────────
  DISH_RECOGNITION_MODE: ${DISH_RECOGNITION_MODE:-local_embedding}
  INFERENCE_API_TOKEN: ${INFERENCE_API_TOKEN:-cv2026}
  INFERENCE_API_TIMEOUT: ${INFERENCE_API_TIMEOUT:-60}
  INFERENCE_CONTROL_TIMEOUT: ${INFERENCE_CONTROL_TIMEOUT:-3}
  RECOGNITION_TASK_SOFT_TIME_LIMIT: ${RECOGNITION_TASK_SOFT_TIME_LIMIT:-150}
  RECOGNITION_TASK_TIME_LIMIT: ${RECOGNITION_TASK_TIME_LIMIT:-180}
  RECOGNITION_DISPATCH_LEASE_SECONDS: ${RECOGNITION_DISPATCH_LEASE_SECONDS:-300}
  RECOGNITION_QUEUED_LEASE_SECONDS: ${RECOGNITION_QUEUED_LEASE_SECONDS:-21600}
  VIDEO_ANALYSIS_MAX_CONCURRENCY: ${VIDEO_ANALYSIS_MAX_CONCURRENCY:-2}
  VIDEO_ANALYSIS_MAX_PENDING: ${VIDEO_ANALYSIS_MAX_PENDING:-0}
  VIDEO_DISTRIBUTED_PIPELINE: ${VIDEO_DISTRIBUTED_PIPELINE:-true}
  VIDEO_RECORDING_JOB_STALE_SECONDS: ${VIDEO_RECORDING_JOB_STALE_SECONDS:-7200}
  VIDEO_RECORDING_JOB_MAX_RECOVERIES: ${VIDEO_RECORDING_JOB_MAX_RECOVERIES:-5}
  VIDEO_DOWNLOAD_MAX_IN_FLIGHT: ${VIDEO_DOWNLOAD_MAX_IN_FLIGHT:-4}
  VIDEO_EXTRACT_MAX_IN_FLIGHT: ${VIDEO_EXTRACT_MAX_IN_FLIGHT:-4}
  VIDEO_RECORDING_DISPATCH_LEASE_SECONDS: ${VIDEO_RECORDING_DISPATCH_LEASE_SECONDS:-300}
  VIDEO_RECORDING_QUEUED_LEASE_SECONDS: ${VIDEO_RECORDING_QUEUED_LEASE_SECONDS:-21600}
  VIDEO_RECORDING_HEARTBEAT_LEASE_SECONDS: ${VIDEO_RECORDING_HEARTBEAT_LEASE_SECONDS:-1800}
  VIDEO_RECORDING_DISPATCH_MAX_ATTEMPTS: ${VIDEO_RECORDING_DISPATCH_MAX_ATTEMPTS:-20}
  VIDEO_DOWNLOAD_TASK_SOFT_TIME_LIMIT: ${VIDEO_DOWNLOAD_TASK_SOFT_TIME_LIMIT:-1800}
  VIDEO_DOWNLOAD_TASK_TIME_LIMIT: ${VIDEO_DOWNLOAD_TASK_TIME_LIMIT:-2100}
  VIDEO_RECORDING_TASK_SOFT_TIME_LIMIT: ${VIDEO_RECORDING_TASK_SOFT_TIME_LIMIT:-10800}
  VIDEO_RECORDING_TASK_TIME_LIMIT: ${VIDEO_RECORDING_TASK_TIME_LIMIT:-11400}
  VIDEO_EXTRACT_USE_SUBPROCESS: ${VIDEO_EXTRACT_USE_SUBPROCESS:-true}
  VIDEO_EXTRACT_PROGRESS_STALL_SECONDS: ${VIDEO_EXTRACT_PROGRESS_STALL_SECONDS:-900}
  VIDEO_EXTRACT_MAX_RUNTIME_SECONDS: ${VIDEO_EXTRACT_MAX_RUNTIME_SECONDS:-7200}
  VIDEO_EXTRACT_FFMPEG_TIMEOUT_SECONDS: ${VIDEO_EXTRACT_FFMPEG_TIMEOUT_SECONDS:-1800}
  VIDEO_EXTRACT_CPU_THREADS_PER_JOB: ${VIDEO_EXTRACT_CPU_THREADS_PER_JOB:-2}
  VIDEO_EXTRACT_DECODE_BACKEND: ${VIDEO_EXTRACT_DECODE_BACKEND:-opencv}
  VIDEO_EXTRACT_GPU_MAX_CONCURRENCY: ${VIDEO_EXTRACT_GPU_MAX_CONCURRENCY:-2}
  VIDEO_EXTRACT_DEGRADE_BEFORE_SYNC_TIMEOUT_SECONDS: ${VIDEO_EXTRACT_DEGRADE_BEFORE_SYNC_TIMEOUT_SECONDS:-1800}
  VIDEO_EXTRACT_FALLBACK_INTERVAL_SECONDS: ${VIDEO_EXTRACT_FALLBACK_INTERVAL_SECONDS:-30}
  VIDEO_EXTRACT_FALLBACK_MAX_FRAMES: ${VIDEO_EXTRACT_FALLBACK_MAX_FRAMES:-500}
  VIDEO_ANALYSIS_MAX_EVENT_CANDIDATES: ${VIDEO_ANALYSIS_MAX_EVENT_CANDIDATES:-120}
  VIDEO_ANALYSIS_MAX_SCAN_HISTORY: ${VIDEO_ANALYSIS_MAX_SCAN_HISTORY:-10000}
  VIDEO_ANALYSIS_QUALITY_MAX_DIMENSION: ${VIDEO_ANALYSIS_QUALITY_MAX_DIMENSION:-320}
  VIDEO_ANALYSIS_CANDIDATE_FPS: ${VIDEO_ANALYSIS_CANDIDATE_FPS:-4.0}
  LEGACY_ANALYSIS_MAX_WIDTH: ${LEGACY_ANALYSIS_MAX_WIDTH:-960}
  LEGACY_ANALYSIS_MAX_HEIGHT: ${LEGACY_ANALYSIS_MAX_HEIGHT:-540}
  VIDEO_EXTRACT_MIN_DECODE_COMPLETION_RATIO: ${VIDEO_EXTRACT_MIN_DECODE_COMPLETION_RATIO:-0.5}
  EVENT_SCAN_FPS: ${EVENT_SCAN_FPS:-12.0}
  VIDEO_SYNC_TASK_SOFT_TIME_LIMIT: ${VIDEO_SYNC_TASK_SOFT_TIME_LIMIT:-43200}
  VIDEO_SYNC_TASK_TIME_LIMIT: ${VIDEO_SYNC_TASK_TIME_LIMIT:-43800}
  CELERY_VISIBILITY_TIMEOUT: ${CELERY_VISIBILITY_TIMEOUT:-86400}
  DETECTOR_API_BASE_URL: ${DETECTOR_API_BASE_URL:-http://10.0.4.29:5001}
  RETRIEVAL_API_BASE_URL: ${RETRIEVAL_API_BASE_URL:-http://10.0.4.29:5002}
  YOLO_MAX_REGIONS: ${YOLO_MAX_REGIONS:-6}
  LOCAL_QWEN3_VL_EMBEDDING_PRECISION: ${LOCAL_QWEN3_VL_EMBEDDING_PRECISION:-auto}
  LOCAL_SIGLIP2_REPO_ID: ${INFERENCE_LOCAL_SIGLIP2_REPO_ID:-google/siglip2-so400m-patch16-512}
  LOCAL_SIGLIP2_MODEL_PATH: ${INFERENCE_LOCAL_SIGLIP2_MODEL_PATH:-/data/models/siglip2-so400m-patch16-512}
  LOCAL_DINOV3_REPO_ID: ${INFERENCE_LOCAL_DINOV3_REPO_ID:-timm/vit_base_patch16_dinov3.lvd1689m}
  LOCAL_DINOV3_MODEL_PATH: ${INFERENCE_LOCAL_DINOV3_MODEL_PATH:-/data/models/vit-base-patch16-dinov3-lvd1689m}
  LOCAL_RETRIEVAL_PIPELINE: ${LOCAL_RETRIEVAL_PIPELINE:-qwen}
  LOCAL_EMBEDDING_MAX_PIXELS: ${LOCAL_EMBEDDING_MAX_PIXELS:-786432}
  LOCAL_EMBEDDING_CROP_PADDING_RATIO: ${LOCAL_EMBEDDING_CROP_PADDING_RATIO:-0.06}
  SAMPLE_IMAGE_MIN_EDGE: ${SAMPLE_IMAGE_MIN_EDGE:-128}
  SAMPLE_IMAGE_MAX_PIXELS: ${SAMPLE_IMAGE_MAX_PIXELS:-16777216}
  SAMPLE_IMAGE_MAX_ASPECT_RATIO: ${SAMPLE_IMAGE_MAX_ASPECT_RATIO:-3.0}
  VISUAL_PATCH_MAX_TOKENS: ${VISUAL_PATCH_MAX_TOKENS:-256}
  # ─── Optional integrations (only needed when enabled) ─────────────────────────
  ZTK_DB_HOST: ${ZTK_DB_HOST:-}
  ZTK_DB_PORT: ${ZTK_DB_PORT:-1433}
  ZTK_DB_NAME: ${ZTK_DB_NAME:-ZYTK40_PLUS}
  ZTK_DB_USER: ${ZTK_DB_USER:-}
  ZTK_DB_PASSWORD: ${ZTK_DB_PASSWORD:-}
  ZTK_SYNC_ENABLED: ${ZTK_SYNC_ENABLED:-false}
  DINGTALK_APP_KEY: ${DINGTALK_APP_KEY}
  DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET}
  DINGTALK_AGENT_ID: ${DINGTALK_AGENT_ID}
  DINGTALK_CORP_ID: ${DINGTALK_CORP_ID}
  DINGTALK_WEBHOOK_TOKEN: ${DINGTALK_WEBHOOK_TOKEN:-}
  MENU_REMINDER_DINGTALK_MODE: ${MENU_REMINDER_DINGTALK_MODE:-app}
  MENU_REMINDER_DINGTALK_WEBHOOK_URL: ${MENU_REMINDER_DINGTALK_WEBHOOK_URL:-}
  MENU_REMINDER_DINGTALK_WEBHOOK_PREFIX: ${MENU_REMINDER_DINGTALK_WEBHOOK_PREFIX:-[营养监测系统提醒]}
  NUTRITION_ALERT_NOTIFICATION_ENABLED: ${NUTRITION_ALERT_NOTIFICATION_ENABLED:-true}
  WEEKLY_REPORT_DAY_OF_WEEK: ${WEEKLY_REPORT_DAY_OF_WEEK:-sunday}
  WEEKLY_REPORT_TIME: ${WEEKLY_REPORT_TIME:-08:00}
  STUDENT_SYNC_PROVIDER: ${STUDENT_SYNC_PROVIDER:-dingtalk}
  STUDENT_SYNC_REST_URL: ${STUDENT_SYNC_REST_URL:-}
  STUDENT_SYNC_REST_API_KEY: ${STUDENT_SYNC_REST_API_KEY:-}
  STUDENT_SYNC_REST_HTTP_METHOD: ${STUDENT_SYNC_REST_HTTP_METHOD:-GET}
  STUDENT_SYNC_REST_TIMEOUT_SECONDS: ${STUDENT_SYNC_REST_TIMEOUT_SECONDS:-15}
  STUDENT_SYNC_SCHOOL_NAME: ${STUDENT_SYNC_SCHOOL_NAME:-默认学校}
  STUDENT_SYNC_CAMPUS_NAME: ${STUDENT_SYNC_CAMPUS_NAME:-默认校区}
  STUDENT_SYNC_STAGE_NAME: ${STUDENT_SYNC_STAGE_NAME:-默认学段}
  STUDENT_SYNC_DEACTIVATE_MISSING: ${STUDENT_SYNC_DEACTIVATE_MISSING:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
  OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: nutrition_db
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition -d nutrition_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  flask-api:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: /bin/sh -c "flask bootstrap-db && exec gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 wsgi:app"
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  celery-worker:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: celery -A wsgi:celery worker --loglevel=info --concurrency=2 -Q celery,matching,maintenance
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g  # OpenCV needs more memory

  celery-worker-recognition:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: celery -A wsgi:celery worker --loglevel=info --concurrency=${RECOGNITION_WORKER_CONCURRENCY:-2} -Q recognition
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g

  celery-worker-video:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: celery -A wsgi:celery worker --loglevel=info --concurrency=1 -Q video
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g

  celery-worker-video-download:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: celery -A wsgi:celery worker --loglevel=info --concurrency=${VIDEO_DOWNLOAD_WORKER_CONCURRENCY:-2} -Q video-download
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g

  celery-worker-video-extract:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: celery -A wsgi:celery worker --loglevel=info --concurrency=${VIDEO_EXTRACT_WORKER_CONCURRENCY:-2} -Q video-extract
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3g

  celery-beat:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: celery -A wsgi:celery beat --loglevel=info --schedule /app/celerybeat-data/celerybeat-schedule
    volumes:
      - celery_beat_data:/app/celerybeat-data
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy

  flower:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: unless-stopped
    command: celery -A wsgi:celery flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    environment:
      <<: *backend-env
    expose:
      - "5555"  # internal only

  frontend:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/frontend:${VERSION:-latest}
    restart: always
    environment:
      TZ: Asia/Shanghai
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "5080:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
      - ${DATA_DIR:-./data}/images:/data/images:ro
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache:ro
    depends_on:
      - flask-api
      - frontend
    deploy:
      resources:
        limits:
          memory: 128m

  # MediaMTX - RTSP ingest to WebRTC preview server (disabled)
  # mediamtx:
  #   image: bluenviron/mediamtx:latest-ffmpeg
  #   environment:
  #     TZ: Asia/Shanghai
  #   ports:
  #     - "8554:8554"       # RTSP ingest
  #     - "8889:8889"       # WebRTC / WHEP HTTP
  #     - "8189:8189/tcp"   # WebRTC ICE TCP fallback
  #     - "8189:8189/udp"   # WebRTC ICE UDP
  #   volumes:
  #     - ./mediamtx.yml:/mediamtx.yml:ro
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  celery_beat_data:
  nginx_logs:
