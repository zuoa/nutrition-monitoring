version: '3.9'

x-backend-env: &backend-env
  TZ: Asia/Shanghai
  FLASK_ENV: production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: nutrition_db
  POSTGRES_USER: nutrition
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  SECRET_KEY: ${SECRET_KEY}
  DINGTALK_APP_KEY: ${DINGTALK_APP_KEY}
  DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET}
  DINGTALK_AGENT_ID: ${DINGTALK_AGENT_ID}
  DINGTALK_CORP_ID: ${DINGTALK_CORP_ID}
  DINGTALK_WEBHOOK_TOKEN: ${DINGTALK_WEBHOOK_TOKEN:-}
  QWEN_API_KEY: ${QWEN_API_KEY}
  QWEN_API_URL: ${QWEN_API_URL:-https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation}
  QWEN_MODEL: ${QWEN_MODEL:-qwen-vl-max}
  DISH_RECOGNITION_MODE: ${DISH_RECOGNITION_MODE:-local_embedding}
  LOCAL_REBUILD_SAMPLE_EMBEDDINGS_ON_UPLOAD: ${LOCAL_REBUILD_SAMPLE_EMBEDDINGS_ON_UPLOAD:-true}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
  OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
  ROI_REGION: '${ROI_REGION:-null}'
  EVENT_SCAN_FPS: ${EVENT_SCAN_FPS:-10.0}
  LEGACY_ANALYSIS_MAX_WIDTH: ${LEGACY_ANALYSIS_MAX_WIDTH:-1280}
  LEGACY_ANALYSIS_MAX_HEIGHT: ${LEGACY_ANALYSIS_MAX_HEIGHT:-720}
  LEGACY_QUICK_STABLE_FRAMES_MIN: ${LEGACY_QUICK_STABLE_FRAMES_MIN:-1}
  LEGACY_MIN_EVENT_GAP_SECONDS: ${LEGACY_MIN_EVENT_GAP_SECONDS:-0.8}
  FG_RATIO_THRESHOLD: ${FG_RATIO_THRESHOLD:-0.10}
  FRONTEND_URL: ${FRONTEND_URL:-http://nutrition.school.edu.cn}
  INFERENCE_API_TOKEN: ${INFERENCE_API_TOKEN:-cv2026}
  INFERENCE_API_TIMEOUT: ${INFERENCE_API_TIMEOUT:-180}
  INFERENCE_CONTROL_TIMEOUT: ${INFERENCE_CONTROL_TIMEOUT:-3}
  DETECTOR_API_BASE_URL: ${DETECTOR_API_BASE_URL:-http://10.0.4.29:5001}
  RETRIEVAL_API_BASE_URL: ${RETRIEVAL_API_BASE_URL:-http://10.0.4.29:5002}
  YOLO_MAX_REGIONS: ${YOLO_MAX_REGIONS:-6}

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: nutrition_db
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition -d nutrition_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  flask-api:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: /bin/sh -c "flask bootstrap-db && exec gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 wsgi:app"
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  celery-worker:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: celery -A wsgi:celery worker --loglevel=info --concurrency=4 -Q celery
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          memory: 2g  # OpenCV needs more memory

  celery-beat:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: always
    command: celery -A wsgi:celery beat --loglevel=info --schedule /app/celerybeat-data/celerybeat-schedule
    volumes:
      - celery_beat_data:/app/celerybeat-data
    environment:
      <<: *backend-env
    depends_on:
      - redis

  flower:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    restart: unless-stopped
    command: celery -A wsgi:celery flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    environment:
      <<: *backend-env
    expose:
      - "5555"  # internal only

  frontend:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/frontend:${VERSION:-latest}
    restart: always
    environment:
      TZ: Asia/Shanghai
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "5080:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
      - ${DATA_DIR:-./data}/images:/data/images:ro
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache:ro
    depends_on:
      - flask-api
      - frontend
      - mediamtx
    deploy:
      resources:
        limits:
          memory: 128m

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8554:8554"       # RTSP ingest
      - "8889:8889"       # WebRTC / WHEP HTTP
      - "8189:8189/tcp"   # WebRTC ICE TCP fallback
      - "8189:8189/udp"   # WebRTC ICE UDP
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  celery_beat_data:
  nginx_logs:
