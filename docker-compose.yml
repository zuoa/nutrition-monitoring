services:
  postgres:
    image: postgres:15-alpine
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: nutrition_db
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrition_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition -d nutrition_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  flask-api:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    command: /bin/sh -c "flask bootstrap-db && exec gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 wsgi:app"
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  celery-worker:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    command: celery -A wsgi:celery worker --loglevel=info --concurrency=2 -Q celery,matching,maintenance
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy

  celery-worker-recognition:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    command: celery -A wsgi:celery worker --loglevel=info --concurrency=${RECOGNITION_WORKER_CONCURRENCY:-2} -Q recognition
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy

  celery-worker-video:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    command: celery -A wsgi:celery worker --loglevel=info --concurrency=1 -Q video
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy

  celery-worker-video-download:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    command: celery -A wsgi:celery worker --loglevel=info --concurrency=${VIDEO_DOWNLOAD_WORKER_CONCURRENCY:-2} -Q video-download
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy

  celery-worker-video-extract:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    command: celery -A wsgi:celery worker --loglevel=info --concurrency=${VIDEO_EXTRACT_GPU_MAX_CONCURRENCY:-2} -Q video-extract
    runtime: ${NVIDIA_RUNTIME:-nvidia}
    volumes:
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache
      - ${DATA_DIR:-./data}/images:/data/images
      - ${DATA_DIR:-./data}/models:/data/models
    environment:
      <<: *backend-env
      NVIDIA_VISIBLE_DEVICES: ${VIDEO_EXTRACT_GPU_DEVICE:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${VIDEO_EXTRACT_NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy

  celery-beat:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    command: celery -A wsgi:celery beat --loglevel=info --scheduler celery.beat:PersistentScheduler --schedule /app/celerybeat-data/celerybeat-schedule
    volumes:
      - celery_beat_data:/app/celerybeat-data
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      flask-api:
        condition: service_healthy

  detector-api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-zuoa/nutrition-monitoring}/inference:${VERSION:-latest}
    command: /bin/sh -c "exec gunicorn --bind 0.0.0.0:5000 --workers 1 --timeout 90 inference_wsgi:app"
    runtime: ${NVIDIA_RUNTIME:-nvidia}
    volumes:
      - ${INFERENCE_DATA_DIR:-./inference-data}/detector/models:/models/yolo
    environment:
      <<: *inference-env
      INFERENCE_SERVICE_ROLE: detector
      LOCAL_RUNTIME_CONFIG_PATH: /models/yolo/runtime_config.json
      NVIDIA_VISIBLE_DEVICES: ${DETECTOR_GPU_DEVICE:-all}
    expose:
      - "5000"

  retrieval-api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-zuoa/nutrition-monitoring}/inference:${VERSION:-latest}
    command: /bin/sh -c "exec gunicorn --bind 0.0.0.0:5000 --workers 1 --timeout 90 inference_wsgi:app"
    runtime: ${NVIDIA_RUNTIME:-nvidia}
    volumes:
      - ${INFERENCE_DATA_DIR:-./inference-data}/retrieval/models:/data/models
      - ${INFERENCE_DATA_DIR:-./inference-data}/retrieval/index:/data/index
    environment:
      <<: *inference-env
      INFERENCE_SERVICE_ROLE: retrieval
      NVIDIA_VISIBLE_DEVICES: ${RETRIEVAL_GPU_DEVICE:-all}
    expose:
      - "5000"

  flower:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/api:${VERSION:-latest}
    command: celery -A wsgi:celery flower --port=5555
    environment:
      <<: *backend-env
    ports:
      - "5555:5555"
    depends_on:
      - redis

  # MediaMTX - RTSP ingest to WebRTC preview server
#  mediamtx:
#    image: bluenviron/mediamtx:1
#    environment:
#      TZ: Asia/Shanghai
#    ports:
#      - "8554:8554"       # RTSP ingest
#      - "8889:8889"       # WebRTC / WHEP HTTP
#      - "8189:8189/tcp"   # WebRTC ICE TCP fallback
#      - "8189:8189/udp"   # WebRTC ICE UDP
#    volumes:
#      - ./mediamtx.yml:/mediamtx.yml:ro
#    restart: unless-stopped

  frontend:
    image: ${REGISTRY:-ghcr.io}/zuoa/nutrition-monitoring/frontend:${VERSION:-latest}
    environment:
      TZ: Asia/Shanghai
    expose:
      - "80"
    volumes:
      - ${DATA_DIR:-./data}/images:/data/images:ro
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache:ro
    depends_on:
      - flask-api
#      - mediamtx

  nginx:
    image: nginx:alpine
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "5080:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
      - ${DATA_DIR:-./data}/images:/data/images:ro
      - ${DATA_DIR:-./data}/nvr_cache:/data/nvr_cache:ro
    depends_on:
      - flask-api
      - frontend
#      - mediamtx

volumes:
  postgres_data:
  redis_data:
  celery_beat_data:
  nginx_logs:
