x-inference-env: &inference-env
  TZ: Asia/Shanghai
  FLASK_ENV: production
  INFERENCE_API_TOKEN: ${INFERENCE_API_TOKEN:?INFERENCE_API_TOKEN must be set}
  INFERENCE_API_TIMEOUT: ${INFERENCE_API_TIMEOUT:-60}
  INFERENCE_SERVICE_ROLE: ${INFERENCE_SERVICE_ROLE:-all}
  HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
  HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
  HF_TOKEN: ${HF_TOKEN:-}
  PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
  YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-/models/yolo/best.pt}
  YOLO_DEVICE: ${YOLO_DEVICE:-}
  YOLO_CONF_THRESHOLD: ${YOLO_CONF_THRESHOLD:-0.7}
  YOLO_IOU_THRESHOLD: ${YOLO_IOU_THRESHOLD:-0.4}
  YOLO_MAX_REGIONS: ${YOLO_MAX_REGIONS:-6}
  MAX_YOLO_MODEL_SIZE: ${MAX_YOLO_MODEL_SIZE:-524288000}
  LOCAL_MODEL_STORAGE_PATH: ${INFERENCE_LOCAL_MODEL_STORAGE_PATH:-/data/models}
  LOCAL_QWEN3_VL_EMBEDDING_MODEL_PATH: ${INFERENCE_LOCAL_QWEN3_VL_EMBEDDING_MODEL_PATH:-/data/models/qwen3-vl-embedding-2b}
  LOCAL_QWEN3_VL_EMBEDDING_PRECISION: ${LOCAL_QWEN3_VL_EMBEDDING_PRECISION:-auto}
  LOCAL_QWEN3_VL_RERANKER_MODEL_PATH: ${INFERENCE_LOCAL_QWEN3_VL_RERANKER_MODEL_PATH:-/data/models/qwen3-vl-reranker-2b}
  LOCAL_SIGLIP2_MODEL_PATH: ${INFERENCE_LOCAL_SIGLIP2_MODEL_PATH:-/data/models/siglip2-so400m-patch16-512}
  LOCAL_DINOV3_REPO_ID: ${INFERENCE_LOCAL_DINOV3_REPO_ID:-timm/vit_base_patch16_dinov3.lvd1689m}
  LOCAL_DINOV3_MODEL_PATH: ${INFERENCE_LOCAL_DINOV3_MODEL_PATH:-/data/models/vit-base-patch16-dinov3-lvd1689m}
  LOCAL_RETRIEVAL_PIPELINE: ${LOCAL_RETRIEVAL_PIPELINE:-qwen}
  VISUAL_RECALL_TOPK: ${VISUAL_RECALL_TOPK:-50}
  VISUAL_PATCH_TOPN: ${VISUAL_PATCH_TOPN:-10}
  VISUAL_PATCH_MAX_TOKENS: ${VISUAL_PATCH_MAX_TOKENS:-256}
  VISUAL_MAXSIM_THRESHOLD: ${VISUAL_MAXSIM_THRESHOLD:-0.5}
  DISH_CONFUSION_HIGH_THRESHOLD: ${DISH_CONFUSION_HIGH_THRESHOLD:-0.85}
  DISH_CONFUSION_MEDIUM_THRESHOLD: ${DISH_CONFUSION_MEDIUM_THRESHOLD:-0.75}
  DISH_CONFUSION_MAX_PAIRS: ${DISH_CONFUSION_MAX_PAIRS:-100}
  LOCAL_QWEN3_VL_RERANKER_PRECISION: ${LOCAL_QWEN3_VL_RERANKER_PRECISION:-auto}
  LOCAL_QWEN3_VL_EMBEDDING_INSTRUCTION: ${LOCAL_QWEN3_VL_EMBEDDING_INSTRUCTION:-}
  LOCAL_QWEN3_VL_RERANKER_INSTRUCTION: ${LOCAL_QWEN3_VL_RERANKER_INSTRUCTION:-检索与当前餐盘菜区最相关的食堂菜品图片。}
  LOCAL_EMBEDDING_INDEX_DIR: ${INFERENCE_LOCAL_EMBEDDING_INDEX_DIR:-/data/index}
  LOCAL_EMBEDDING_SIMILARITY_THRESHOLD: ${LOCAL_EMBEDDING_SIMILARITY_THRESHOLD:-0.32}
  LOCAL_EMBEDDING_TOPK: ${LOCAL_EMBEDDING_TOPK:-3}
  LOCAL_EMBEDDING_BATCH_SIZE: ${LOCAL_EMBEDDING_BATCH_SIZE:-8}
  LOCAL_EMBEDDING_MAX_PIXELS: ${LOCAL_EMBEDDING_MAX_PIXELS:-786432}
  LOCAL_RERANK_ENABLED: ${LOCAL_RERANK_ENABLED:-true}
  LOCAL_RERANK_TOPN: ${LOCAL_RERANK_TOPN:-3}
  LOCAL_RERANK_SCORE_THRESHOLD: ${LOCAL_RERANK_SCORE_THRESHOLD:-0.6}

services:
  detector-api:
    build:
      context: ./inference
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-zuoa/nutrition-monitoring}/inference:${VERSION:-latest}
    restart: always
    command: /bin/sh -c "exec gunicorn --bind 0.0.0.0:5000 --workers 1 --timeout 90 inference_wsgi:app"
    runtime: ${NVIDIA_RUNTIME:-nvidia}
    environment:
      <<: *inference-env
      INFERENCE_SERVICE_ROLE: detector
      LOCAL_RUNTIME_CONFIG_PATH: /models/yolo/runtime_config.json
      NVIDIA_VISIBLE_DEVICES: ${DETECTOR_GPU_DEVICE:-all}
    volumes:
      - ${INFERENCE_DATA_DIR:-./inference-data}/detector/models:/models/yolo
    ports:
      - "${DETECTOR_API_PORT:-5001}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  retrieval-api:
    build:
      context: ./inference
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-zuoa/nutrition-monitoring}/inference:${VERSION:-latest}
    restart: always
    command: /bin/sh -c "exec gunicorn --bind 0.0.0.0:5000 --workers 1 --timeout 90 inference_wsgi:app"
    runtime: ${NVIDIA_RUNTIME:-nvidia}
    environment:
      <<: *inference-env
      INFERENCE_SERVICE_ROLE: retrieval
      NVIDIA_VISIBLE_DEVICES: ${RETRIEVAL_GPU_DEVICE:-all}
    volumes:
      - ${INFERENCE_DATA_DIR:-./inference-data}/retrieval/models:/data/models
      - ${INFERENCE_DATA_DIR:-./inference-data}/retrieval/index:/data/index
    ports:
      - "${RETRIEVAL_API_PORT:-5002}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
